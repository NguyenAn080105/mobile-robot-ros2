amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.5
    alpha2: 0.3
    alpha3: 0.3
    alpha4: 0.5
    alpha5: 0.3
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    laser_model_type: "likelihood_field"
    max_particles: 2000
    min_particles: 500
    scan_topic: "/scan_filtered"
    transform_tolerance: 1.0
    update_min_a: 0.1
    update_min_d: 0.1

    set_initial_pose: true
    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_z: 0.0
    initial_pose_yaw: 0.0

    subscribers:
      scan:
        topic: "/scan_filtered"
        reliability: "best_effort"
        durability: "volatile"

# ================= MAP SERVER =================
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""   # Sẽ được override bởi launch arg 'map'

# ================= CONTROLLER SERVER (DWB) =================
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true
      min_vel_x: 0.0
      max_vel_x: 0.26
      max_vel_theta: 1.0
      acc_lim_x: 2.5
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_theta: -3.2
      vx_samples: 20
      vtheta_samples: 20
      sim_time: 1.7
      xy_goal_tolerance: 0.25
      transform_tolerance: 0.5

# ================= PLANNER SERVER =================
planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.0
      use_astar: false

# ================= LOCAL COSTMAP =================
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      rolling_window: true
      width: 3.0
      height: 3.0
      resolution: 0.05
      robot_radius: 0.14
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: "/scan_filtered"
          max_obstacle_height: 2.0
          clearing: true
          marking: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

# ================= GLOBAL COSTMAP =================
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      robot_radius: 0.14
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: "/scan_filtered"
          max_obstacle_height: 2.0
          clearing: true
          marking: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

# ================= BT NAVIGATOR & RECOVERIES =================
bt_navigator:
  ros__parameters:
    use_sim_time: true

recoveries_server:
  ros__parameters:
    use_sim_time: true

# ================= LIFECYCLE MANAGER =================
lifecycle_manager:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: ['map_server', 'amcl', 'controller_server', 'planner_server', 'bt_navigator', 'recoveries_server']