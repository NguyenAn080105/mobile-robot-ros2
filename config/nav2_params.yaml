# ==================== GLOBAL COSTMAP ====================
# Costmap tĩnh + động toàn bản đồ — được bộ lập lịch toàn cục NavFn/A* sử dụng.
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: map              # neo vào frame bản đồ tĩnh
      footprint: "[[0.355, 0.30], [0.355, -0.30], [-0.14, -0.30], [-0.14, 0.30]]"
      resolution: 0.05               # [m/ô lưới]
      footprint_padding: 0.01
      robot_base_frame: base_footprint
      update_frequency: 8.0          # [Hz] thấp hơn cục bộ (lập lịch lại toàn cục chậm hơn)
      publish_frequency: 2.0         # [Hz]

      plugin_names: ["static_layer", "obstacle_layer", "inflation_layer"]
      plugin_types:
        - "nav2_costmap_2d::StaticLayer"
        - "nav2_costmap_2d::ObstacleLayer"
        - "nav2_costmap_2d::InflationLayer"

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True  # dùng QoS latched/transient-local cho topic /map

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered
          sensor_frame: laser_frame
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 14.5   # [m]  phạm vi xóa vùng trống rộng hơn trên bản đồ toàn cục
          raytrace_min_range: 0.0
          obstacle_max_range: 14.0   # [m]  phạm vi đánh dấu vật cản rộng hơn trên bản đồ toàn cục
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.5
        inflation_radius: 0.37       # [m]

      always_send_full_costmap: True

  global_costmap_client:
    ros__parameters:
      use_sim_time: True
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

# ==================== MAP SERVER ====================
map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: "/home/nguyenan/mbrobot_ws/src/mobile_robot/maps/lab_demo_map.yaml"

# ==================== PLANNER SERVER ====================
# Bộ lập lịch toàn cục NavFn — tính toán đường đi không va chạm trên costmap toàn cục.
planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 5.0  # [Hz] tần suất lập lịch lại mục tiêu
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.25                 # [m]  dung sai đích cho tìm kiếm điểm cuối đường dẫn
      use_astar: true                # A* (true) nhanh hơn Dijkstra cho bản đồ trong nhà
      allow_unknown: False           # không lập lịch xuyên qua các ô chưa khám phá

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

navfn_planner_GetCostmap_client:
  ros__parameters:
    use_sim_time: True

# ==================== RECOVERIES SERVER ====================
# Thực thi các hành vi phục hồi khi robot bị kẹt hoặc không thể đến đích.
recoveries_server:
  ros__parameters:
    use_sim_time: True
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0            # [Hz] tần suất vòng lặp thực thi phục hồi

    recovery_plugins: ["wait","spin", "backup" ]
    spin:
      plugin: "nav2_recoveries/Spin"    # xoay tại chỗ để quan sát xung quanh
    backup:
      plugin: "nav2_recoveries/BackUp"  # lùi một khoảng ngắn để giải phóng robot
    wait:
      plugin: "nav2_recoveries/Wait"    # tạm dừng để vật cản động di chuyển khỏi đường

    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.5         # [s]  dung sai TF trong quá trình thực thi phục hồi

    simulate_ahead_time: 2.0         # [s]  kiểm tra va chạm tiến trước khi thực thi phục hồi

    # Giới hạn bao vận tốc góc áp dụng trong quá trình phục hồi Spin.
    max_rotational_vel: 0.2          # [rad/s] giới hạn trên
    min_rotational_vel: 0.1          # [rad/s] giới hạn dưới để thắng ma sát tĩnh
    rotational_acc_lim: 0.3          # [rad/s²] dốc nhẹ nhàng để giảm nhiễu IMU


# ==================== LIFECYCLE MANAGER ====================
# Điều phối các chuyển trạng thái vòng đời configure → activate → deactivate của các node Nav2.
lifecycle_manager:
  ros__parameters:
    use_sim_time: True
    autostart: True                  # tự động kích hoạt tất cả node được quản lý khi khởi động
    node_names:
      - map_server
      - amcl
      - controller_server
      - planner_server
      - bt_navigator
      - recoveries_server


lifecycle_manager_service_client:
  ros__parameters:
    use_sim_time: True

lifecycle_manager_client_service_client:
  ros__parameters:
    use_sim_time: True
