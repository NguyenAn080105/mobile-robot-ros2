      #     raytrace_max_range: 10.5
      #     raytrace_min_range: 0.0
      #     inf_is_valid: false

      # range_layer:
      #   plugin: "nav2_costmap_2d::RangeSensorLayer"
      #   enabled: True
      #   topics: [
      #     "/ultrasonic/us_top_left",
      #     "/ultrasonic/us_top_right",
      #     "/ultrasonic/us_mid_left",
      #     "/ultrasonic/us_mid_right",
      #     "/ultrasonic/us_bot_left",
      #     "/ultrasonic/us_bot_right"
      #   ]
      #   inflate_cone: 1.0
      #   no_readings_timeout: 0.0
      #   # ← ĐỔI: false để KHÔNG xóa khi max range, giữ mark lâu hơn để debug
      #   clear_on_max_reading: false
