# ==================== AMCL ====================
amcl:
  ros__parameters:
    use_sim_time: True
    set_initial_pose: True
    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_z: 0.0
    initial_pose_yaw: 0.0
    alpha1: 0.5
    alpha2: 0.3
    alpha3: 0.3
    alpha4: 0.5
    alpha5: 0.3
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: True
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 20.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "differential"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 0.2
    update_min_a: 0.1
    update_min_d: 0.1
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /scan_filtered

amcl_map_client:
  ros__parameters:
    use_sim_time: True

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: True

# ==================== BT NAVIGATOR ====================
bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered 
    bt_loop_duration: 5
    default_server_timeout: 10
    default_bt_xml_filename: "/opt/ros/foxy/share/nav2_bt_navigator/behavior_trees/navigate_w_replanning_and_recovery.xml"
    enable_groot_monitoring: False
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: True

# ==================== CONTROLLER SERVER (DWB) ====================
controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True

      # ── Giới hạn vận tốc ──────────────────────────────────────────────────
      # v_max phần cứng = 0.5 m/s; giảm 30 % vì an toàn → 0.346 m/s
      min_vel_x: 0.0               # [m/s] không điều khiển lùi
      min_vel_y: 0.0               # [m/s] không dịch ngang (dẫn động vi sai)
      max_vel_x: 0.346             # [m/s] giới hạn vận tốc tiến
      max_vel_y: 0.0               # [m/s] không dịch ngang (dẫn động vi sai)
      max_vel_theta: 1.643         # [rad/s] giới hạn tốc độ góc (≈ giới hạn phần cứng)
      min_vel_theta: 0.0
      min_speed_xy: 0.0            # [m/s] tốc độ XY kết hợp tối thiểu
      max_speed_xy: 0.346          # [m/s] tốc độ XY kết hợp tối đa

      # ── Giới hạn gia tốc / giảm tốc ──────────────────────────────────────
      # Dốc tăng tốc nhẹ nhàng để ngăn trượt bánh và giảm nhiễu rung IMU.
      acc_lim_x: 0.0865            # [m/s²]  từ 0 lên tối đa trong ≈ 4 s
      acc_lim_y: 0.0               # [m/s²]  dẫn động vi sai
      acc_lim_theta: 1.0           # [rad/s²]

      decel_lim_x: -0.172          # [m/s²]  dốc phanh (gấp 2× gia tốc để dừng chặt hơn)
      decel_lim_y: 0.0
      decel_lim_theta: -0.821      # [rad/s²]

      # ── Lấy mẫu quỹ đạo ──────────────────────────────────────────────────
      vx_samples: 20               # số mẫu vận tốc tuyến tính trong cửa sổ động
      vy_samples: 0                # không lấy mẫu ngang
      vtheta_samples: 30           # số mẫu vận tốc góc

      # ── Mô phỏng tiến ───────────────────────────────────────────────────
      sim_time: 2.5                # [s]   độ dài chân trời rollout
      linear_granularity: 0.05     # [m]   bước cung tròn để kiểm tra va chạm
      angular_granularity: 0.025   # [rad] bước góc để kiểm tra va chạm
      transform_tolerance: 0.3     # [s]   dung sai tuổi tra cứu TF
      trans_stopped_velocity: 0.02 # [m/s] ngưỡng tốc độ xác định "robot đứng yên"
      short_circuit_trajectory_evaluation: True # huỷ chấm điểm ngay khi chạm vùng chi phí chết người
      stateful: True               # giữ lại hướng tốt nhất cuối cùng qua các chu kỳ tick

      # --- Goal tolerance ---
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

      # --- Critics ---
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 12.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

# ==================== LOCAL COSTMAP ====================
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: odom
      plugin_names: ["obstacle_layer", "inflation_layer"]
      plugin_types: ["nav2_costmap_2d::ObstacleLayer", "nav2_costmap_2d::InflationLayer"]
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      footprint: "[[0.32, 0.30], [0.32, -0.30], [-0.12, -0.30], [-0.12, 0.30]]"
      update_frequency: 20.0
      publish_frequency: 10.0
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan ultrasonic
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

        ultrasonic:
          topic: /ultrasonic_scan
          sensor_frame: base_footprint
          data_type: LaserScan
          marking: true
          clearing: true
          max_obstacle_height: 0.5
          min_obstacle_height: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.15
          raytrace_max_range: 3.0
          raytrace_min_range: 0.10
          
      inflation_layer:
        cost_scaling_factor: 5.0
        inflation_radius: 0.35
      always_send_full_costmap: True

# ==================== GLOBAL COSTMAP ====================
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: map
      footprint: "[[0.32, 0.30], [0.32, -0.30], [-0.12, -0.30], [-0.12, 0.30]]"
      resolution: 0.05
      update_frequency: 8.0
      publish_frequency: 3.0
      plugin_names: ["static_layer", "obstacle_layer", "inflation_layer"]
      plugin_types:
        - "nav2_costmap_2d::StaticLayer"
        - "nav2_costmap_2d::ObstacleLayer"
        - "nav2_costmap_2d::InflationLayer"
      static_layer:
        map_subscribe_transient_local: True
      obstacle_layer:
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        cost_scaling_factor: 5.0
        inflation_radius: 0.35
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: True
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

# ==================== MAP SERVER ====================
map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""

# ==================== PLANNER SERVER ====================
planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: false

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

navfn_planner_GetCostmap_client:
  ros__parameters:
    use_sim_time: True

# ==================== RECOVERIES SERVER ====================
recoveries_server:
  ros__parameters:
    use_sim_time: True
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    recovery_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_recoveries/Spin"
    backup:
      plugin: "nav2_recoveries/BackUp"
    wait:
      plugin: "nav2_recoveries/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

# ==================== LIFECYCLE MANAGER ====================
lifecycle_manager:
  ros__parameters:
    use_sim_time: True
    autostart: True
    node_names:
      - map_server
      - amcl
      - controller_server
      - planner_server
      - bt_navigator
      - recoveries_server

lifecycle_manager_service_client:
  ros__parameters:
    use_sim_time: True

lifecycle_manager_client_service_client:
  ros__parameters:
    use_sim_time: True