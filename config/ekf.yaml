### ekf_filter_node configuration for sensor fusion
### Kết hợp dữ liệu từ Wheel Odometry và IMU

ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    transform_time_offset: 0.0
    transform_timeout: 0.0

    publish_tf: true
    publish_acceleration: false
    print_diagnostics: true
    debug: false

    # ============================================
    # WHEEL ODOMETRY
    # ============================================
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10
    odom0_rejection_threshold: 5.0

    # ============================================
    # IMU
    # [FIX] Topic đổi từ /imu/data → /imu cho đúng với gazebo plugin
    # (plugin publish: <remapping>~/out:=/imu</remapping>)
    # ============================================
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    # [FIX] Chỉ fuse yaw orientation và yaw_rate (2D robot)
    # Bỏ roll/pitch vì two_d_mode=true, không cần thiết và gây noise
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true
    imu0_rejection_threshold: 5.0

    # ============================================
    # PROCESS NOISE COVARIANCE
